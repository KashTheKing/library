# API sidebar: one class per package, grouped by what it is for.
[[classOrder]]
section = "Instances & lifecycle"
classes = ["Binder", "Predicates", "Attributor", "Authority"]

[[classOrder]]
section = "Networking & state"
classes = ["Packet"]

[[classOrder]]
section = "Gameplay"
classes = ["Hitbox", "CameraController", "GuiHandler"]

[[classOrder]]
section = "Utilities"
classes = ["t", "ClassProperties", "CountryFlags"]

[[classOrder]]
section = "Deprecated"
classes = ["Mechanic", "AppliedMechanic", "StateManager", "State", "ClientSettings", "SoundPool", "SoundPlayback"]
