title = "KashTheKing's Library"
gitRepoUrl = "https://github.com/KashTheKing/library"
gitSourceBranch = "main"
changelog = false

[docusaurus]
url = "https://kashtheking.com"
baseUrl = "/library/"
organizationName = "KashTheKing"
projectName = "library"
tagline = "Reusable Roblox packages, plugins, building blocks and guides. Grab what you need!"
favicon = "img/favicon.svg"
trailingSlash = true
onBrokenAnchors = "ignore"

[navbar]
title = "KashTheKing's Library"

[navbar.logo]
src = "img/favicon.svg"
alt = "KashTheKing's Library"

# Moonwave adds "Docs" and "API" on the left and "GitHub" on the right; these sit between them.
[[navbar.items]]
to = "/docs/packages/"
label = "Packages"
position = "left"

[[navbar.items]]
to = "/docs/plugins/"
label = "Plugins"
position = "left"

[[navbar.items]]
to = "/docs/building-blocks/"
label = "Building Blocks"
position = "left"

[[navbar.items]]
to = "/docs/guides/"
label = "Guides"
position = "left"

[[navbar.items]]
href = "https://discord.gg/6HYgCk22eD"
label = "Discord"
position = "right"

[[navbar.items]]
to = "/docs/support/"
label = "Support"
position = "right"

[footer]
style = "dark"
copyright = "Copyright © 2026 KashTheKing. Packages and building blocks are MIT; the Studio plugins are distributed on the Creator Store under their own terms."

[[footer.links]]
title = "Library"
items = [
	{ label = "Getting started", to = "/docs/intro/" },
	{ label = "Packages", to = "/docs/packages/" },
	{ label = "Plugins", to = "/docs/plugins/" },
	{ label = "Building Blocks", to = "/docs/building-blocks/" },
	{ label = "Guides", to = "/docs/guides/" },
	{ label = "API reference", to = "/api/" },
]

