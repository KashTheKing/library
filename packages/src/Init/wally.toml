[package]
name = "kashtheking/init"
version = "1.0.0"
description = "A module loader for Roblox games: point it at folders and it requires, initializes and starts every module in order, with OnPlayerAdded, OnHeartbeat and friends wired up for you."
license = "MIT"
authors = ["KashTheKing"]
homepage = "https://kashtheking.com/init/"
repository = "https://github.com/KashTheKing/init"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = ["build", "docs", "example", "plugin", "scripts", "skills", "templates", "tests", ".github", ".moonwave", "node_modules", "example.project.json", "plugin.project.json", "moonwave.toml", "package.json", "AGENTS.md", "CLAUDE.md"]

[dependencies]
