[package]
name = "kashtheking/stagger"
version = "0.1.0"
description = "GTA V / Euphoria style balance-loss for R15: characters stutter-step to regain their footing, then either recover or ragdoll, using Roblox's AnimationConstraint rigs. Server authoritative, networked with Packet."
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
license = "MIT"
authors = ["KashTheKing"]
exclude = ["rokit.toml"]

[dependencies]
Packet = "kashtheking/packet@1.0.0"
Binder = "kashtheking/binder@0.6.3"
Trove = "sleitnick/trove@1.8.0"
Signal = "sleitnick/signal@2.0.3"
